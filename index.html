<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
@media (prefers-color-scheme: dark) { :root { color-scheme: dark; } }

<title>Kostkownik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: sticky top bar with breadcrumb, then one centred column (max 1120px); case cards in an auto-fill grid. Cube sticker colours are the only loud colours on the page. */
:root {
  --bg: #eef1ef;
  --surface: #ffffff;
  --surface-2: #e3e8e5;
  --fg: #16201b;
  --muted: #5a6760;
  --line: #cfd8d3;
  --accent: #0b7a4b;
  --accent-ink: #ffffff;
  --accent-soft: #d5ebe0;
  --learning: #b76e00;
  --learning-soft: #fbeccf;
  --plastic: #1b1f1d;
  --off: #9aa39e;
  --s-U: #ffd400; --s-D: #ffffff; --s-F: #00a35a; --s-B: #1665d8; --s-R: #d7263d; --s-L: #ff7a1a;
  --m-U: #ffffff; --m-F: #00a35a; --m-R: #d7263d; --m-L: #7b3fc4; --m-b: #1665d8; --m-l: #ffd400;
  --m-D: #9aa0a6; --m-r: #8fd14f; --m-c: #ff8ac4; --m-B: #6ec6ff; --m-e: #ff7a1a; --m-g: #efe3b8;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101513; --surface: #182019; --surface-2: #222b26; --fg: #e7eee9; --muted: #95a39b;
    --line: #2d3832; --accent: #3ccf8e; --accent-ink: #062214; --accent-soft: #173a2a;
    --learning: #f0b04a; --learning-soft: #3a2c12; --plastic: #050706; --off: #4b5550;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101513; --surface: #182019; --surface-2: #222b26; --fg: #e7eee9; --muted: #95a39b;
  --line: #2d3832; --accent: #3ccf8e; --accent-ink: #062214; --accent-soft: #173a2a;
  --learning: #f0b04a; --learning-soft: #3a2c12; --plastic: #050706; --off: #4b5550;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5; font-variation-settings: "wdth" 100; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1120px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 12px; }
.logo { font-family: var(--f-display); font-weight: 800; font-variation-settings: "wdth" 125; letter-spacing: -0.01em; font-size: 18px; text-decoration: none; color: var(--fg); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.crumbs { display: flex; gap: 6px; align-items: center; min-width: 0; overflow: hidden; color: var(--muted); font-size: 14px; flex: 1; }
.crumbs a { color: var(--muted); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumbs a:hover { color: var(--fg); }
.crumbs .sep { opacity: .5; }
.crumbs .here { color: var(--fg); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.navbtn { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; text-decoration: none; color: var(--fg); white-space: nowrap; }
.navbtn:hover { border-color: var(--fg); }

main { max-width: 1120px; margin: 0 auto; padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
h1 { font-size: clamp(28px, 6vw, 44px); font-weight: 800; font-variation-settings: "wdth" 120; letter-spacing: -0.02em; line-height: 1.05; }
h2 { font-size: 22px; font-weight: 700; font-variation-settings: "wdth" 112; }
h3 { font-size: 17px; font-weight: 700; }
.lede { color: var(--muted); max-width: 62ch; margin: 10px 0 0; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* home */
.hero { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; margin-bottom: 28px; }
.hero svg { width: 120px; height: auto; }
.stats { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 16px; font-variant-numeric: tabular-nums; }
.stats b { font-family: var(--f-display); font-size: 22px; font-variation-settings: "wdth" 120; display: block; line-height: 1.1; }
.stats span { color: var(--muted); font-size: 13px; }
.grid-pz { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 12px; }
.pz { display: grid; grid-template-rows: auto 1fr auto; gap: 8px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); text-decoration: none; color: var(--fg); transition: border-color .15s, transform .15s; }
.pz:hover { border-color: var(--accent); transform: translateY(-2px); }
.pz .ic { height: 64px; display: flex; align-items: center; }
.pz .ic svg { height: 64px; width: auto; }
.pz .nm { font-family: var(--f-display); font-weight: 750; font-size: 19px; font-variation-settings: "wdth" 115; }
.pz .meta { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

/* puzzle view */
.methods { display: grid; gap: 16px; margin-top: 24px; }
.method { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.mhead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.lvl { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-weight: 600; }
.mdesc { color: var(--muted); margin: 6px 0 12px; max-width: 70ch; }
.steps { display: grid; gap: 0; border-top: 1px solid var(--line); }
.step { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--fg); }
.step:last-child { border-bottom: 0; }
a.step:hover { background: var(--surface-2); }
.step .num { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.step .t { font-weight: 650; }
.step .d { color: var(--muted); font-size: 14px; }
.step .links { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; font-size: 14px; }
.cnt { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.cnt .bar-p { width: 46px; height: 5px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.cnt .bar-p i { display: block; height: 100%; background: var(--accent); }
.srcline { margin-top: 18px; color: var(--muted); font-size: 14px; display: flex; gap: 10px; flex-wrap: wrap; }

/* set view */
.sethead { display: grid; gap: 8px; margin-bottom: 18px; }
.badges { display: flex; gap: 8px; flex-wrap: wrap; font-size: 13px; }
.badge { padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.badge.ok { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 600; }
.note { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; color: var(--muted); font-size: 14px; max-width: 75ch; }
.tools { display: grid; gap: 10px; margin: 14px 0 18px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.search { flex: 1 1 220px; min-width: 0; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg); font: inherit; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.progress { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.grid-c { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.case { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; grid-template-columns: auto 1fr; gap: 12px; align-content: start; content-visibility: auto; contain-intrinsic-size: 260px 150px; position: relative; }
.case.st-1 { box-shadow: inset 4px 0 0 var(--learning); }
.case.st-2 { box-shadow: inset 4px 0 0 var(--accent); }
.case.noimg { grid-template-columns: 1fr; }
.case .pic svg { width: 92px; height: 92px; display: block; }
.case.wide { grid-template-columns: 1fr; }
.case.wide .pic svg { width: 100%; max-width: 240px; height: auto; }
.case .body { min-width: 0; display: grid; gap: 6px; align-content: start; }
.case .top { display: flex; justify-content: space-between; gap: 6px; align-items: start; }
.case .cn { font-weight: 700; font-size: 15px; line-height: 1.25; }
.case .cs { color: var(--muted); font-size: 12px; }
.alg { font-family: var(--f-mono); font-size: 14px; font-weight: 500; line-height: 1.45; word-spacing: .12em; overflow-wrap: anywhere; background: var(--surface-2); border-radius: 6px; padding: 6px 8px; cursor: copy; border: 0; text-align: left; width: 100%; }
.alg.main { font-size: 15px; }
.alg:hover { outline: 1px solid var(--line); }
.alts { display: grid; gap: 4px; }
.alts .alg { font-size: 13px; background: transparent; border: 1px dashed var(--line); }
.mini { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; }
.mini button, .mini a { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: none; }
.cdesc { font-size: 13px; color: var(--muted); }
.stbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; font-size: 11px; padding: 2px 8px; cursor: pointer; white-space: nowrap; color: var(--muted); }
.st-1 .stbtn { background: var(--learning-soft); color: var(--learning); border-color: transparent; font-weight: 700; }
.st-2 .stbtn { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 700; }
.empty { color: var(--muted); padding: 30px 0; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--fg); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 20; }
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

/* notation */
.nt { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-top: 18px; }
.nt div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.nt code, .kbd { font-family: var(--f-mono); font-weight: 600; background: var(--surface-2); padding: 1px 6px; border-radius: 4px; }
.nt p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }

@media (max-width: 560px) {
  .hero { grid-template-columns: 1fr; }
  .hero svg { display: none; }
  .logo span.full { display: none; }
  .grid-pz { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-c { grid-template-columns: 1fr; }
  .step { grid-template-columns: 22px 1fr; }
  .step .cnt { grid-column: 2; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="bar"><div class="bar-in">
  <a class="logo" href="#start" aria-label="Kostkownik – start"><span id="logoIc"></span><span class="full">Kostkownik</span></a>
  <nav class="crumbs" id="crumbs" aria-label="Ścieżka"></nav>
  <a class="navbtn" href="#notacja">Notacja</a>
</div></header>
<main id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>// Minimal 3x3 sticker simulator (also used for 2x2 by ignoring edges/centers).
// Sticker ids 0..53: face*9 + idx, faces U R F D L B. State = array pos->sticker id.
(function (root) {
  const FACES = "URFDLB";
  const N = { U: [0, 1, 0], R: [1, 0, 0], F: [0, 0, 1], D: [0, -1, 0], L: [-1, 0, 0], B: [0, 0, -1] };
  function grid(f, r, c) {
    const a = c - 1, b = 1 - r;
    switch (f) {
      case "U": return [a, 1, r - 1];
      case "D": return [a, -1, 1 - r];
      case "F": return [a, b, 1];
      case "B": return [-a, b, -1];
      case "R": return [1, b, -a];
      case "L": return [-1, b, a];
    }
  }
  const POS = []; // index -> {p, n}
  for (let f = 0; f < 6; f++) for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++)
    POS.push({ p: grid(FACES[f], r, c), n: N[FACES[f]] });
  const key = (p, n) => p.join(",") + "|" + n.join(",");
  const IDX = {}; POS.forEach((s, i) => (IDX[key(s.p, s.n)] = i));
  function rot(v, axis, q) {
    let [x, y, z] = v; q = ((q % 4) + 4) % 4;
    for (let i = 0; i < q; i++) {
      if (axis === 0) [y, z] = [-z, y];
      else if (axis === 1) [x, z] = [z, -x];
      else [x, y] = [-y, x];
    }
    return [x, y, z];
  }
  // move def: axis, direction (q for clockwise-quarter), layer predicate on coordinate
  const DEF = {
    R: [0, -1, c => c === 1], L: [0, 1, c => c === -1], M: [0, 1, c => c === 0],
    U: [1, -1, c => c === 1], D: [1, 1, c => c === -1], E: [1, 1, c => c === 0],
    F: [2, -1, c => c === 1], B: [2, 1, c => c === -1], S: [2, -1, c => c === 0],
    r: [0, -1, c => c >= 0], l: [0, 1, c => c <= 0], u: [1, -1, c => c >= 0],
    d: [1, 1, c => c <= 0], f: [2, -1, c => c >= 0], b: [2, 1, c => c <= 0],
    x: [0, -1, () => true], y: [1, -1, () => true], z: [2, -1, () => true],
  };
  const PERM = {};
  for (const m in DEF) {
    const [ax, dir, pred] = DEF[m];
    const perm = POS.map((s, i) => {
      if (!pred(s.p[ax])) return i;
      return IDX[key(rot(s.p, ax, dir), rot(s.n, ax, dir))];
    });
    PERM[m] = perm; // sticker at i moves to perm[i]
  }
  function solved() { return [...Array(54).keys()]; }
  function applyBase(st, m, times) {
    const p = PERM[m];
    for (let t = 0; t < times; t++) {
      const ns = new Array(54);
      for (let i = 0; i < 54; i++) ns[p[i]] = st[i];
      st = ns;
    }
    return st;
  }
  // ---- parsing ----
  function normalizeAlg(s) {
    return s.replace(/[’`´‘]/g, "'").replace(/\*\s*(\d)/g, "$1").replace(/[\[\]]/g, m => (m === "[" ? "(" : ")"));
  }
  function tokenize(s) {
    s = normalizeAlg(s);
    const out = []; let i = 0;
    const re = /^([RLUDFBMESrludfbxyz])(w?)(\d*)('?)(\d*)('?)/;
    while (i < s.length) {
      const ch = s[i];
      if (/\s|,/.test(ch)) { i++; continue; }
      if (ch === "(") { out.push({ open: true }); i++; continue; }
      if (ch === ")") {
        i++; let k = ""; while (i < s.length && /\d/.test(s[i])) k += s[i++];
        let prime = false; if (s[i] === "'") { prime = true; i++; }
        out.push({ close: true, times: k ? +k : 1, prime }); continue;
      }
      const m = re.exec(s.slice(i));
      if (!m) throw new Error("bad token at '" + s.slice(i, i + 6) + "' in: " + s);
      let face = m[1]; if (m[2]) face = face.toLowerCase();
      const n = +(m[3] || m[5] || 1); const prime = !!(m[4] || m[6]);
      out.push({ face, amt: ((prime ? -n : n) % 4 + 4) % 4 });
      i += m[0].length;
    }
    // expand groups
    function expand(list) {
      const stack = [[]];
      for (const t of list) {
        if (t.open) stack.push([]);
        else if (t.close) {
          let g = stack.pop(); if (!stack.length) throw new Error("unbalanced");
          if (t.prime) g = invertMoves(g);
          for (let k = 0; k < t.times; k++) stack[stack.length - 1].push(...g);
        } else stack[stack.length - 1].push(t);
      }
      if (stack.length !== 1) throw new Error("unbalanced (");
      return stack[0];
    }
    return expand(out);
  }
  function invertMoves(ms) { return ms.slice().reverse().map(t => ({ face: t.face, amt: (4 - t.amt) % 4 })); }
  function apply(st, alg) {
    const ms = typeof alg === "string" ? tokenize(alg) : alg;
    for (const t of ms) if (t.amt) st = applyBase(st, t.face, t.amt);
    return st;
  }
  function invertAlg(alg) { return invertMoves(tokenize(alg)); }
  // rotations to normalize centers
  const ROTS = [];
  (function () {
    const seen = new Set();
    const seqs = ["", "x", "x2", "x'", "z", "z'"];
    for (const a of seqs) for (const b of ["", "y", "y2", "y'"]) {
      const s = (a + " " + b).trim(); const st = apply(solved(), s); const k = st[4] + "," + st[22];
      if (!seen.has(k)) { seen.add(k); ROTS.push(s); }
    }
  })();
  const CENTERS = [4, 13, 22, 31, 40, 49];
  function centersOk(st) { return CENTERS.every(c => Math.floor(st[c] / 9) === Math.floor(c / 9)); }
  function normalize(st) {
    for (const r of ROTS) { const s2 = apply(st, r); if (s2[4] === 4 && s2[22] === 22) return s2; }
    return st;
  }
  // The case as seen when holding the cube in the standard orientation before running `alg`.
  // A rotation at the START (not the end) is what keeps the alg valid, so we pre-rotate the
  // solved cube and relabel ids so that rotated-solved reads as identity.
  function caseState(alg) {
    const inv = invertAlg(alg);
    for (const r of ROTS) {
      const st = apply(apply(solved(), r), inv);
      if (CENTERS.every(c => st[c] === c)) return st; // ids travel with stickers, so this is exact
    }
    return normalize(apply(solved(), inv)); // centers moved by slices: fall back
  }
  // Every valid starting hold: pre-rotate the solved cube by each of the 24 rotations, undo the alg.
  function candidates(alg) {
    const inv = invertAlg(alg);
    return ROTS.map(r => apply(apply(solved(), r), inv));
  }
  const color = id => FACES[Math.floor(id / 9)];
  root.Cube = { FACES, POS, solved, apply, tokenize, invertAlg, caseState, candidates, normalize, color, ROTS, centersOk };
})(typeof module !== "undefined" ? module.exports : window);

:"333-ell"},{"name":"ZBLL","desc":"Cała ostatnia warstwa z krzyżem jednym algorytmem.","set":"333-zbll"}]},{"name":"OH (jedną ręką)","level":"Średni → zaawansowany","desc":"CFOP dostosowany do układania jedną ręką: algorytmy oparte na R, U, F i rotacjach, łatwe do wykonania jedną dłonią.","steps":[{"name":"OH OLL","set":"333-oholl"},{"name":"OH PLL","set":"333-ohpll"}]},{"name":"BLD (na ślepo)","level":"Zaawansowany","desc":"Zapamiętujesz kostkę, zasłaniasz oczy i układasz element po elemencie. Old Pochmann to klasyczna metoda na start, M2 – kolejny krok dla krawędzi.","steps":[{"name":"Old Pochmann i M2","desc":"Algorytmy zamiany elementów i parzystości.","set":"333-bld","links":[{"t":"Tabele BLD (The Best List Ever)","u":"https://bestsiteever.ru/tables/"}]}]},{"name":"FMC (najmniej ruchów)","level":"Zaawansowany","desc":"Masz godzinę na znalezienie jak najkrótszego rozwiązania na kartce. Liczy się kreatywność, nie szybkość: bloki, insercje, NISS, odwrotny scramble.","steps":[{"name":"Techniki FMC","desc":"Budowanie bloków (2x2x2, 2x2x3), skeleton z kilkoma niewłożonymi elementami, a potem insercje 3-cykli. Gdy start nie idzie, spróbuj na odwróconym scramble (NISS).","links":[{"t":"FMC – poradnik i lista elementów","u":"https://fmcsolves.cubing.net/"}]}]}],"links":[{"t":"SpeedCubeDB","u":"https://speedcubedb.com/"},{"t":"CubingApp","u":"https://cubingapp.com/algdb.html"},{"t":"Arkusze Tao Yu","u":"https://drive.google.com/drive/u/0/folders/1bK3wUbRcqYZX8IGkp7Lk0V8HLk-KSK6N"}]},{"id":"222","name":"2x2","full":"Kostka 2x2x2","methods":[{"name":"Metoda warstwowa","level":"Początkujący","desc":"Pierwsza warstwa intuicyjnie (jak narożniki na 3x3), potem orientacja i permutacja górnej warstwy.","steps":[{"name":"Pierwsza warstwa","desc":"Ułóż cztery narożniki jednego koloru tak, by boki pasowały do siebie. Przydaje się R U R' U'."},{"name":"Ostatnia warstwa","desc":"Sune do orientacji, T-perm i Y-perm do permutacji.","set":"222-lbl"}]},{"name":"Ortega","level":"Średni","desc":"Ściana (nie warstwa) na dole, potem OLL na górze, a na koniec PBL – permutacja obu warstw naraz.","steps":[{"name":"Ortega OLL","set":"222-ortegaoll"},{"name":"PBL","desc":"Permutacja obu warstw.","set":"222-pbl"}]},{"name":"CLL","level":"Średni → zaawansowany","desc":"Pierwsza warstwa, a potem cała górna warstwa jednym algorytmem – 42 przypadki.","steps":[{"name":"CLL","set":"222-cll"}]},{"name":"EG","level":"Zaawansowany","desc":"Robisz tylko ścianę na dole, a algorytm układa resztę – również dolną warstwę. EG-1: dolna warstwa ma zamianę sąsiednią, EG-2: po przekątnej. Razem z CLL to pełne EG.","steps":[{"name":"CLL (EG-0)","set":"222-cll"},{"name":"EG-1","set":"222-eg1"},{"name":"EG-2","set":"222-eg2"}]}],"links":[{"t":"SpeedCubeDB","u":"https://speedcubedb.com/"},{"t":"JPerm – PBL","u":"https://jperm.net/algs/2x2/pbl"}]},{"id":"444","name":"4x4","full":"Kostka 4x4x4","methods":[{"name":"Yau / Redukcja","level":"Średni","desc":"Układasz centra i łączysz krawędzie w pary, żeby kostka zachowywała się jak 3x3. Na koniec mogą pojawić się parzystości (parity), których 3x3 nie ma.","steps":[{"name":"Centra","desc":"Dwa przeciwległe centra, potem pozostałe. Ostatnie dwa centra (L2C):","set":"444-l2c"},{"name":"Łączenie krawędzi","desc":"W Yau po krzyżu z 3 krawędzi łączysz resztę. Ostatnie 3 krawędzie (F3E):","set":"444-f3e"},{"name":"OLL parity","desc":"Jedna krawędź odwrócona na górze.","set":"444-ollp"},{"name":"PLL parity","desc":"Dwie krawędzie (lub narożniki) zamienione miejscami.","set":"444-pllp"},{"name":"OLL + parity","desc":"OLL od razu z naprawą parity.","set":"444-ollplus"},{"name":"Big cube OLL","desc":"Przypadki ostatniej warstwy, które występują tylko na większych kostkach.","set":"big-oll"},{"name":"Big cube PLL","set":"big-pll"}]}],"links":[{"t":"SpeedCubeDB","u":"https://speedcubedb.com/"},{"t":"Centra, krawędzie i parity","u":"https://cubingcheatsheet.com/algs4x.html"},{"t":"Algorytmy parity","u":"https://cubingapp.com/algdb/4x4-PLL-Parity.htm const PAL = {

// Square-1: top and bottom layer, bottom seen from below; pieces = [type, start slot, top colour, side colours]
function sq1Pic(sq) {
  const R1 = 1, rad = d => (d * Math.PI) / 180;
  const pt = (ang, r, cx) => [cx + Math.sin(rad(ang)) * r, -Math.cos(rad(ang)) * r];
  const P = a => a.map(p => p.map(v => v.toFixed(3)).join(",")).join(" ");

    let out = "";
    for (const [t, start, top, sides] of items) {
      let a0 = 165 + 30 * start; const span = t === "c" ? 60 : 30;
      const ang = a => (mirror ? -a : a);
      const re = 1 / Math.cos(rad(15)), rc = Math.SQRT2;
      const outer = t === "c" ? [[a0, re], [a0 + 30, rc], [a0 + 60, re]] : [[a0, re], [a0 + 30, re]];
      const poly = [[cx, 0], ...outer.map(([a, r]) => pt(ang(a), r, cx))];
      out += `<polygon points="${P(poly)}" fill="var(--s-${top})" stroke="var(--plastic)" stroke-width="0.06" stroke-linejoin="round"/>`;
      // side stickers as a band just outside the outer edge

    }

  };

  return `<svg viewBox="-1.85 -1.85 7.4 4.3" role="img" aria-label="Square-1: góra i dół">${layer(sq.t, 0, false)}${layer(sq.b, 3.7, true)}<g transform="translate(1.85 0)">${mid}</g></svg>`;

function casePic(set, c) {

}

const SOLVED = [...Array(54).keys()];
function glyph(id) {

    sq1: `<svg viewBox="0 0 100 100"><rect x="8" y="8" width="84" height="84" rx="6" fill="var(--plastic)"/><polygon points="50,14 86,14 86,50 50,50" fill="var(--s-U)"/><polygon points="14,14 50,14 50,50" fill="var(--s-U)"/><polygon points="14,14 50,50 14,50" fill="var(--s-U)"/><polygon points="14,50 50,50 50,86 14,86" fill="var(--s-U)"/><polygon points="50,50 86,50 86,86" fill="var(--s-U)"/><polygon points="50,50 86,86 50,86" fill="var(--s-U)"/><path d="M14,14 86,86M50,14V86M14,50H86" stroke="var(--plastic)" stroke-width="3"/></svg>`,

let tt;
function toast(m) { const el = document.getElementById("toast"); el.textContent = m; el.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("on"), 1600); }

function viewNotation() {
  crumbs([["Start", "#start"], ["Notacja", "#notacja"]]);
  const card = (t, b) => `<div><h3>${t}</h3><p>${b}</p></div>`;
  $app.innerHTML = `<div class="eyebrow">Jak czytać algorytmy</div><h1>Notacja</h1>
  <p class="lede">Patrzysz na kostkę z przodu. Litera to obrót ściany o 90° zgodnie z ruchem wskazówek zegara, gdy patrzysz prosto na tę ścianę.</p>
  <div class="nt">
    ${card("Ściany", `<code>R</code> prawa, <code>L</code> lewa, <code>U</code> góra, <code>D</code> dół, <code>F</code> przód, <code>B</code> tył.`)}
    ${card("Kierunek", `<code>R'</code> – przeciwnie do wskazówek zegara. <code>R2</code> – o 180°. <code>R2'</code> to to samo co <code>R2</code>.`)}
    ${card("Ruchy szerokie", `<code>r</code> lub <code>Rw</code> – dwie warstwy naraz (ściana + środek). Tak samo <code>l u d f b</code>. Na większych kostkach <code>3Rw</code> to trzy warstwy, a <code>3r</code> – tylko trzecia warstwa.`)}
    ${card("Warstwy środkowe", `<code>M</code> – środek między L i R, kręci się jak <code>L</code>. <code>E</code> – między U i D, jak <code>D</code>. <code>S</code> – między F i B, jak <code>F</code>.`)}
    ${card("Obroty całej kostki", `<code>x</code> – jak <code>R</code>, <code>y</code> – jak <code>U</code>, <code>z</code> – jak <code>F</code>. Np. <code>y'</code> obraca kostkę tak, że przód idzie w prawo.`)}
    ${card("Nawiasy", `<code>(R U R' U')3</code> lub <code>[…] *2</code> – powtórz fragment. Nawiasy często oznaczają po prostu wygodne „kawałki” (triggery).`)}
    ${card("Megaminx", `<code>R</code>, <code>U</code>, <code>F</code>, <code>L</code> jak na 3x3, <code>BR</code> – ściana tylna prawa, <code>Dfr</code> – ściana dolna przednia prawa. Obroty o 72°, <code>U2</code> = 144°.`)}
    ${card("Square-1", `<code>(1,0)</code> – górna warstwa o 1/12 obrotu, dolna o 0. <code>/</code> – obrót prawej połowy o 180°.`)}
    ${card("Pyraminx i Skewb", `Litery to obroty o 120° wokół wierzchołka. Pyraminx: <code>R L U B</code>, małe litery <code>r l u b</code> to same czubki. Skewb: algorytmy Sarah używają jej notacji – opis z obrazkami jest na jej stronie (link przy zestawie).`)}
  </div>`;
}

document.getElementById("logoIc").innerHTML = `<span style="display:inline-flex;width:26px;height:26px">${isoView(SOLVED, "full", 3)}</span>`;
route();
</script>
